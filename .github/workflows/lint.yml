name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id `luacheck` is the literal status-check name required by the
  # main-branch ruleset and by release.yml — do not rename it or add a
  # `name:` override without updating both.
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same luacheck rock and Lua as the local toolchain, cached. With
      # LuaLanes installed luacheck checks one file per CPU by default; the
      # Docker image has no lanes and ran the same 1.2.0 three times slower.
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - uses: actions/cache@v6
        id: rocks
        with:
          path: .luarocks
          key: ${{ runner.os }}-lua5.1.5-luarocks3.13.0-luacheck1.2.0-lanes3.17.2

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install luacheck
        if: steps.rocks.outputs.cache-hit != 'true'
        run: |
          luarocks install luacheck 1.2.0-1
          luarocks install lanes 3.17.2-0

      - name: Run luacheck
        timeout-minutes: 1
        run: |
          set -o pipefail
          luacheck -q --formatter plain --codes . 2>&1 | tee "$RUNNER_TEMP/luacheck.txt"

      # Runs after any earlier failure; with no log, luacheck never ran.
      - name: Annotate warnings
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/luacheck.txt" ] || exit 0
          sed -nE 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::warning file=\1,line=\2,col=\3::\4/p' "$RUNNER_TEMP/luacheck.txt"
          { echo '### luacheck'; echo '```'; cat "$RUNNER_TEMP/luacheck.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check spelling
        run: bash dev/scripts/check-spelling.sh
