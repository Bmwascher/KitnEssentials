name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs upstream luacheck (Lua 5.1, in Docker) against the repo using
      # the checked-in .luacheckrc — same engine and config as the local
      # luacheck.exe, so local and CI results always agree.
      - name: Run luacheck
        uses: BigWigsMods/luacheck@main
        with:
          args: -q
          annotate: warning
          job_summary: true
