name: Discord status

# Keeps each forum post the bot made in step with its GitHub issue: the
# issue's state, the commit that closed it, the release tags, and its open PRs
# decide the post's status tag (Triaged, In progress, Fixed, Shipped, Closed).
# Only touches issues labeled `from-discord`. Does nothing until the
# DISCORD_BOT_TOKEN secret is set.
# pull_request_target (not pull_request) so contributor PRs from forks still
# update Discord; it runs this repo's own script and never checks out PR code.
# Only a PR whose author has a role on the repo shows as In progress. An edit
# counts when it changed the description or the base, which is how a
# `Refs #N` turned into `Fixes #N` moves the post.
on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft, closed]
  issues:
    types: [closed, reopened, labeled]
  push:
    # Test copy: KitnEssentials' own v* tags publish real releases, so the
    # "shipped" step is tried with throwaway discord-test-* tags instead.
    tags: ['discord-test-*']
  # The daily sweep: lists (or, with SWEEP_MODE=fix, repairs) every post and
  # label that is out of step. It never messages players.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# actions: read lets the sweep check whether the run behind an unsent message
# can still be re-run.
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  status:
    # Skipped before it can queue: labels other than needs-info, tag
    # deletions or moves (only a newly created tag is a release), and PR
    # edits of the title alone.
    if: >-
      (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'needs-info') &&
      (github.event_name != 'push' || (github.event.created && !github.event.deleted)) &&
      (github.event.action != 'edited' || github.event.changes.body || github.event.changes.base)
    # Release tags run one at a time; one PR's events run in order; everything
    # else runs alone. Runs on one issue may still overlap: each rereads after
    # writing until it agrees, and the sweep repairs what a failure left.
    # GitHub keeps one waiting run per group: a third tag in quick succession
    # replaces the waiting one, whose fixes then ship with the newer tag.
    concurrency:
      group: discord-status-${{ github.event_name == 'push' && 'tags' || github.event.pull_request && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/discord-bot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the Discord post
        run: node .github/discord-bot/status/status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Optional repository variables: which tags are releases, and
          # whether the sweep only reports (default) or also repairs (fix).
          RELEASE_TAG_PATTERN: ${{ vars.RELEASE_TAG_PATTERN || '^discord-test-' }}
          SWEEP_MODE: ${{ vars.SWEEP_MODE || 'report' }}
