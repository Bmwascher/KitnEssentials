name: Discord status

# Moves a forum post along (In progress -> Fixed -> Shipped) when the GitHub
# issue the bot made from it moves. Only touches issues labeled
# `from-discord`. Does nothing until the DISCORD_BOT_TOKEN secret is set.
# pull_request_target (not pull_request) so contributor PRs from forks still
# update Discord; it runs this repo's own script and never checks out PR code.
# The script acts on a PR only when its author has a role on the repo.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [closed, labeled]
  push:
    # Test copy: KitnEssentials' own v* tags publish real releases, so the
    # "shipped" step is tried with throwaway discord-test-* tags instead.
    tags: ['discord-test-*']

permissions:
  contents: read
  issues: write

jobs:
  status:
    # Skipped before it can queue: labels other than needs-info, and tag
    # deletions or moves (only a newly created tag is a release).
    if: >-
      (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'needs-info') &&
      (github.event_name != 'push' || (github.event.created && !github.event.deleted))
    # Release tags run one at a time so two never ship the same issue; one PR's
    # events run in order (opened before closed); everything else runs alone.
    # GitHub keeps one waiting run per group: a third tag in quick succession
    # replaces the waiting one, whose fixes then ship with the newer tag.
    concurrency:
      group: discord-status-${{ github.event_name == 'push' && 'tags' || github.event.pull_request && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/discord-bot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the Discord post
        run: node .github/discord-bot/status/status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Optional repository variable: which tags are releases.
          RELEASE_TAG_PATTERN: ${{ vars.RELEASE_TAG_PATTERN || '^discord-test-' }}
