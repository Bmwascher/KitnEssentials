name: Aura catalog

# Scoped to the files the check can actually read. It guards a product
# decision — which Movement Buffs spells ship switched off — that only
# Core/Defaults.lua can change, so running it on every push reported a
# result nothing had put at risk.
on:
  push:
    branches:
      - '**'
    paths:
      - 'Core/Defaults.lua'
      - 'dev/scripts/check-aura-movement-catalog.lua'
      - '.github/workflows/aura-catalog.yml'
  pull_request:
    paths:
      - 'Core/Defaults.lua'
      - 'dev/scripts/check-aura-movement-catalog.lua'
      - '.github/workflows/aura-catalog.yml'

concurrency:
  group: aura-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not named in the main-branch ruleset, so a failure here reports but does
  # not block. References/ is gitignored, so this run makes the local-only
  # half of the check and says so; the full source cross-check needs a
  # developer checkout.
  aura-movement-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - name: Check the movement aura catalog
        run: lua dev/scripts/check-aura-movement-catalog.lua
