name: Release

# Packaging is gated on the same lint + test jobs that guard every push:
# a v* tag on a red commit must not ship to CurseForge/Wago.
on:
  push:
    tags:
      - 'v*'

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: BigWigsMods/luacheck@9545d4baa7c8d5c2d8dce6591788450680c2485b # main, 2026-06-20
        with:
          args: -q

  # Mirrors test.yml's toolchain exactly (same cache key, same rock set) so
  # the two jobs share one cache and never serve each other stale trees.
  busted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - uses: actions/cache@v4
        id: rocks
        with:
          path: .luarocks
          key: ${{ runner.os }}-lua5.1.5-luarocks3.13.0-busted2.3.0-luacov0.17.0

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install rocks
        if: steps.rocks.outputs.cache-hit != 'true'
        run: |
          luarocks install busted 2.3.0-1
          luarocks install luacov 0.17.0-1

      - name: Busted
        run: busted

  release:
    needs: [luacheck, busted]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
