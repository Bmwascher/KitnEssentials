name: Release

# Packaging is gated on luacheck and busted, as every push is (busted runs
# in file order here; pushes shuffle it): a v* tag on a red commit must not
# ship to CurseForge/Wago.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Mirrors lint.yml's luacheck job (same rocks, same cache key), so a tag
  # is linted by the same engine as every push.
  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - uses: actions/cache@v6
        id: rocks
        with:
          path: .luarocks
          key: ${{ runner.os }}-lua5.1.5-luarocks3.13.0-luacheck1.2.0-lanes3.17.2

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install luacheck
        if: steps.rocks.outputs.cache-hit != 'true'
        run: |
          luarocks install luacheck 1.2.0-1
          luarocks install lanes 3.17.2-0

      - name: Run luacheck
        timeout-minutes: 1
        run: luacheck -q .

  # Mirrors test.yml's toolchain exactly (same cache key, same rock set) so
  # the two jobs share one cache and never serve each other stale trees.
  busted:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - uses: actions/cache@v6
        id: rocks
        with:
          path: .luarocks
          key: ${{ runner.os }}-lua5.1.5-luarocks3.13.0-busted2.3.0-luacov0.17.0

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install rocks
        if: steps.rocks.outputs.cache-hit != 'true'
        run: |
          luarocks install busted 2.3.0-1
          luarocks install luacov 0.17.0-1

      - name: Busted
        timeout-minutes: 1
        run: busted

  release:
    needs: [luacheck, busted]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
