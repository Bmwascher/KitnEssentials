name: Skill Evals

# Deterministic gates for the tracked Claude Code skills (dev/claude-skills/):
# Tier 1 lint (agentskills.io spec), Tier 1b security scan, Tier 2 trigger
# and routing evals, Tier 2b pytest structural tests. No model calls.
# Path-filtered: only runs when skill files change. This workflow's job ids
# are NOT ruleset-required checks (unlike luacheck/busted) - a path-filtered
# job can never satisfy a required check on unrelated pushes.

on:
  push:
    branches:
      - '**'
    paths:
      - 'dev/claude-skills/**'
      - '.github/workflows/skill-evals.yml'
  pull_request:
    paths:
      - 'dev/claude-skills/**'
      - '.github/workflows/skill-evals.yml'

concurrency:
  group: skill-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tier 1 - skill lint (strict)
        run: |
          set -e
          for skill in dev/claude-skills/*/; do
            name="$(basename "$skill")"
            [ "$name" = "evals" ] && continue
            [ -f "$skill/SKILL.md" ] || continue
            python dev/claude-skills/evals/tools/skill_lint.py "$skill" --strict
          done

      - name: Tier 1b - security scan
        run: python dev/claude-skills/evals/tools/skill_scanner.py dev/claude-skills

      - name: Tier 2 - trigger and routing evals
        run: python dev/claude-skills/evals/tools/run_trigger_evals.py

      - name: Tier 2b - structural pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest dev/claude-skills/evals -q
