# Cloudflare Worker for the Discord side. The free plan does, except for repos
# with thousands of bot issues (README, Known limits).
# Secrets (never in this file), set once with `npx wrangler@3 secret put <NAME>`:
#   DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY
name = "discord-issue-bot"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# The post scan every minute, the daily check of waiting posts, and the
# daily setup check. These must match CRONS in src/scan.js; the Worker
# cannot see its own triggers, so after each deploy check that Wrangler
# lists these three schedules. The free plan allows 5 cron triggers per
# account, across all its Workers.
[triggers]
crons = ["* * * * *", "0 15 * * *", "30 15 * * *"]

# Where the scan remembers which posts it has messaged. Create it once with
# `npx wrangler@3 kv namespace create STATE`, then uncomment these three lines
# with the id it prints. Until then the scan does nothing (right-click still works).
# [[kv_namespaces]]
# binding = "STATE"
# id = "<the namespace id>"

[vars]
# Which repo each form choice files into, by a short key the form shows.
# Several repos: {"KE":"owner/one","UI":"owner/two"}.
REPOS = '{"KE":"Bmwascher/KitnEssentials"}'
# The forums the bot works in, keyed by channel id, each with the client and
# type every post there has ({} guesses from the post's tags), and optionally
# the message link of the forum's pinned template (right-click the template
# message > Copy Message Link), whose labels the template check then uses, e.g.
# {"111":{"client":"Retail","type":"Bug","template":"https://discord.com/channels/1/444/555"},"222":{"client":"Forever","type":"Bug"},"333":{"type":"Feature"}}
# Required: while it is empty the bot does nothing anywhere.
FORUMS = ""
# The server those forums are in (the scan lists its posts).
GUILD_ID = ""
# Role ids allowed to press the "Send to GitHub" button, comma separated.
# Empty: only moderators (Manage Threads) can use it.
APPROVED_ROLE_IDS = ""
# Channel for the daily list of posts waiting with no status. Empty: logged only.
MOD_CHANNEL_ID = ""
# Staff channel for queue cards: one per new post, with the "Send to GitHub"
# button. Empty: no cards, and moderators file by right-click.
QUEUE_CHANNEL_ID = ""
# The staff checklist forum: the same id as the repository variable of that
# name, so the bot never treats it as a player forum, even if FORUMS lists it.
CHECKLIST_FORUM_ID = ""
# The repo that holds every filing's lock label (discord-lock-<post id>),
# whichever repo the post goes to. Required when REPOS names more than one
# repo; with one, empty means that repo. Before changing it, see "Changing
# the lock repo" in the README.
LOCK_REPO = ""
# How old a post with no status must be before the daily list names it.
STALE_DAYS = "3"
# Optional: the template fields each type of post should fill, checked as
# advice for moderators only, in a forum with no readable pinned template.
# List every label of the template: a label left out reads as part of the
# answer above it. Default: see DEFAULT_TEMPLATES in src/core.js.
# TEMPLATES = '{"Bug":["Addon version","UI version","Updated with the game closed","What happened","What you expected","How to make it happen again","Screenshots"],"Feature":["Area","My idea or feedback","Why it matters","Screenshots"]}'
